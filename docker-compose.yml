services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agriprofit_app
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-agriprofit_admin}:${POSTGRES_PASSWORD:-agriprofit_secure_pass}@postgres:5432/${POSTGRES_DB:-agriprofit}
      - POSTGIS_ENABLED=true
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml:8000
      - JWT_SECRET=${JWT_SECRET:-change-this-development-secret-before-deployment}
      - SESSION_COOKIE_NAME=agriprofit_session
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ml:
        condition: service_started
    networks:
      - agriprofit_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: agriprofit_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agriprofit_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agriprofit_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-agriprofit}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init_consolidated.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agriprofit_admin -d agriprofit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agriprofit_net

  redis:
    image: redis:7-alpine
    container_name: agriprofit_redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agriprofit_net

  ml:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: agriprofit_ml
    restart: always
    environment:
      - ML_PORT=8000
      - ML_HOST=0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health\", timeout=3)' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - agriprofit_net

  nginx:
    image: nginx:alpine
    container_name: agriprofit_nginx
    restart: always
    ports:
      - "${PUBLIC_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
      ml:
        condition: service_healthy
    networks:
      - agriprofit_net

volumes:
  pgdata:
  redisdata:

networks:
  agriprofit_net:
    driver: bridge

